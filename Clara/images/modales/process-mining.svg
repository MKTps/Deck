<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" role="img" aria-labelledby="t">
  <title id="t">Mapa de proceso con una lupa que detecta un cuello de botella y su gemelo digital</title>
  <circle cx="240" cy="200" r="178" fill="#EEF4FB"/>
  <!-- gemelo digital (capa de fondo) -->
  <g opacity=".35" transform="translate(16 18)" fill="none" stroke="#9DB8D6" stroke-width="3">
    <path d="M70 120h80l60 70h90M150 120l60-60h110M300 190l60 60"/>
  </g>
  <!-- proceso -->
  <g fill="none" stroke-linecap="round">
    <path d="M70 120h80" stroke="#0072BC" stroke-width="5"/>
    <path d="M150 120l60-60h110" stroke="#0072BC" stroke-width="5"/>
    <path d="M150 120l60 70" stroke="#0E337C" stroke-width="12"/>
    <path d="M210 190h90" stroke="#0E337C" stroke-width="12"/>
    <path d="M300 190l60 60" stroke="#0072BC" stroke-width="5"/>
    <path d="M320 60l40 190" stroke="#9DB8D6" stroke-width="4" stroke-dasharray="6 8"/>
  </g>
  <g fill="#fff" stroke-width="4">
    <circle cx="70" cy="120" r="16" stroke="#0072BC"/>
    <circle cx="150" cy="120" r="16" stroke="#0072BC"/>
    <circle cx="210" cy="60" r="14" stroke="#0072BC"/>
    <circle cx="320" cy="60" r="14" stroke="#0072BC"/>
    <circle cx="360" cy="250" r="18" stroke="#0072BC"/>
  </g>
  <!-- cuello de botella -->
  <circle cx="210" cy="190" r="34" fill="#0072BC" opacity=".15"/>
  <circle cx="210" cy="190" r="24" fill="#0072BC" opacity=".3"/>
  <circle cx="210" cy="190" r="16" fill="#0E337C"/>
  <path d="M210 180v12M210 198v2" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <circle cx="300" cy="190" r="14" fill="#fff" stroke="#0E337C" stroke-width="4"/>
  <!-- lupa -->
  <g>
    <circle cx="214" cy="194" r="58" fill="none" stroke="#132436" stroke-width="10"/>
    <path d="M256 236l52 52" stroke="#132436" stroke-width="16" stroke-linecap="round"/>
  </g>
  <!-- métodos -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    <rect x="44" y="322" width="96" height="36" rx="18" fill="#0072BC"/><text x="92" y="345" fill="#fff">BPMN</text>
    <rect x="150" y="322" width="96" height="36" rx="18" fill="#0E337C"/><text x="198" y="345" fill="#fff">DMAIC</text>
    <rect x="256" y="322" width="180" height="36" rx="18" fill="#132436"/><text x="346" y="345" fill="#fff">Lean Six Sigma</text>
  </g>
</svg>
