<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" role="img" aria-labelledby="t">
  <title id="t">Equipo de especialistas aumentado con IA que se integra al equipo del cliente</title>
  <circle cx="240" cy="200" r="178" fill="#EEF4FB"/>
  <!-- equipo del cliente (contenedor) -->
  <rect x="58" y="96" width="364" height="210" rx="28" fill="#fff" stroke="#D9E3EF" stroke-width="2"/>
  <rect x="78" y="114" width="120" height="12" rx="6" fill="#CADCFC"/>
  <!-- personas -->
  <g>
    <g transform="translate(150 214)"><circle cy="-38" r="24" fill="#9DB8D6"/><path d="M-40 38c0-34 18-48 40-48s40 14 40 48z" fill="#9DB8D6"/></g>
    <g transform="translate(330 214)"><circle cy="-38" r="24" fill="#9DB8D6"/><path d="M-40 38c0-34 18-48 40-48s40 14 40 48z" fill="#9DB8D6"/></g>
    <g transform="translate(240 222)"><circle cy="-44" r="30" fill="#0072BC"/><path d="M-50 44c0-42 22-58 50-58s50 16 50 58z" fill="#0072BC"/></g>
  </g>
  <!-- IA supervisada por el especialista -->
  <g transform="translate(296 150)">
    <circle r="26" fill="#0E337C" stroke="#fff" stroke-width="4"/>
    <path d="M0-13l4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="#fff"/>
  </g>
  <!-- control del cliente -->
  <g>
    <rect x="300" y="30" width="148" height="56" rx="16" fill="#132436"/>
    <rect x="316" y="52" width="80" height="10" rx="5" fill="#9DB8D6"/>
    <rect x="316" y="52" width="54" height="10" rx="5" fill="#0072BC"/>
    <circle cx="370" cy="57" r="10" fill="#fff"/>
    <path d="M414 48l12 10-12 10" fill="none" stroke="#CADCFC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- modelos -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    <rect x="40" y="326" width="122" height="38" rx="19" fill="#0072BC"/><text x="101" y="350" fill="#fff">Ágil puro</text>
    <rect x="172" y="326" width="136" height="38" rx="19" fill="#0E337C"/><text x="240" y="350" fill="#fff">Control ágil</text>
    <rect x="318" y="326" width="122" height="38" rx="19" fill="#132436"/><text x="379" y="350" fill="#fff">Costo fijo</text>
  </g>
</svg>
