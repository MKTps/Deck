    <rect x="22" y="76" width="20" height="12" rx="3"/><circle cx="58" cy="82" r="6"/>
    <circle cx="30" cy="104" r="6"/><rect x="44" y="98" width="20" height="12" rx="3"/>
  </g>
  <!-- migración -->
