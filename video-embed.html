<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video embed</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            border: 0;
            background: transparent !important;
            background-color: transparent !important;
            -webkit-appearance: none;
            -webkit-transform: translate3d(0, 0, 0);
            transform: translate3d(0, 0, 0);
        }

        /* Safari specific fix for transparent background */
        @supports (-webkit-appearance: none) {
            video {
                background: transparent !important;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <video id="embed-video" playsinline muted autoplay loop preload="auto"></video>

    <script>
        const params = new URLSearchParams(window.location.search);
        const src = params.get('src');
        const video = document.getElementById('embed-video');

        if (src && video) {
            video.src = src;
            video.controls = false;
            video.muted = true;
            video.autoplay = true;
            video.loop = true;
            video.playsInline = true;
            video.setAttribute('playsinline', '');
            video.setAttribute('disablepictureinpicture', '');
            
            // Fuerza fondo transparente en Safari
            video.style.backgroundColor = 'transparent';
            video.style.background = 'transparent';

            const playPromise = video.play();
            if (playPromise && typeof playPromise.catch === 'function') {
                playPromise.catch(() => {});
            }
        }
        
        // Asegura que el body tenga fondo completamente transparente
        document.body.style.backgroundColor = 'transparent';
        document.body.style.background = 'transparent';
        document.documentElement.style.backgroundColor = 'transparent';
        document.documentElement.style.background = 'transparent';
    </script>
</body>
</html>
